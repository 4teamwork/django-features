name: Tests

on:
  - push

concurrency:
  group: ${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    runs-on: self-hosted
    steps:
      - name: Checkout
        uses: actions/checkout@v3
      - name: Setup python
        uses: actions/setup-python@v4
        with:
          # The lock resolves Django 4.2, whose supported Python ceiling is 3.12.
          python-version: 3.12
      - name: Install poetry
        uses: abatilo/actions-poetry@v2
        with:
          poetry-version: 2.1
      - name: Install dependencies
        run: poetry install
      - name: isort
        run: poetry run isort --check-only --quiet --settings pyproject.toml .
      - name: flake8
        run: poetry run flake8
      - name: black
        run: poetry run black --check --config pyproject.toml .
      - name: mypy
        run: poetry run mypy django_features app
      - name: Verify packaged translations
        run: poetry run python bin/verify_i18n_artifact.py

  test:
    runs-on: self-hosted
    strategy:
      max-parallel: 1
      matrix:
        include:
          - python: "3.12"
            django: "~=4.2.0"
            database: django_features_testing_py312_django42
          - python: "3.13"
            django: "~=5.2.0"
            database: django_features_testing_py313_django52
    services:
      postgres:
        image: postgres
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: ${{ matrix.database }}
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - name: Checkout
        uses: actions/checkout@v3
      - name: Setup python
        uses: actions/setup-python@v4
        with:
          python-version: ${{ matrix.python }}
      - name: Install poetry
        uses: abatilo/actions-poetry@v2
        with:
          poetry-version: 2.1
      - name: Install dependencies
        run: |
          poetry install
          # Intentionally bypass the lock for latest-patch compatibility testing.
          poetry run pip install --upgrade \
            "Django${{ matrix.django }}" \
            "djangorestframework>3.17,<3.18"
          poetry run pip check
      - name: test
        env:
          DJANGO_CONFIGURATION: Testing
          DJANGO_DATABASE_NAME: ${{ matrix.database }}
        run: poetry run pytest
